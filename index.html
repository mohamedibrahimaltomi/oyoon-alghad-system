<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شركة عيون الغد - نظام الموارد البشرية</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

  <div class="topbar">
    <div class="logo">
      <img id="companyLogo" alt="logo">
      <span>شركة عيون الغد</span>
    </div>

    <div class="topbar-right">
      <span id="clock"></span>
      <button onclick="toggleDark()">🌙</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="menu-item" onclick="openPage('dashboard')">لوحة التحكم</div>
    <div class="menu-item" onclick="openPage('employees')">الموظفون</div>
    <div class="menu-item" onclick="openPage('departments')">الأقسام</div>
    <div class="menu-item" onclick="openPage('jobs')">الوظائف</div>
    <div class="menu-item" onclick="openPage('branches')">الفروع</div>

    <div class="menu-item" onclick="openPage('loans')">السلف والديون</div>
    <div class="menu-item" onclick="openPage('payroll')">الرواتب</div>
    <div class="menu-item" onclick="openPage('expenses')">المصروفات</div>
    <div class="menu-item" onclick="openPage('reports')">التقارير</div>
    <div class="menu-item" onclick="openPage('users')">المستخدمون</div>
    <div class="menu-item" onclick="openPage('backups')">النسخ الاحتياطية</div>
    <div class="menu-item" onclick="openPage('settings')">الإعدادات</div>
  </div>

  <div class="content" id="contentArea">
    <div class="card">
      <h2>مرحبا بك في نظام شركة عيون الغد</h2>
      <p>الإصدار الرابع V4</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
